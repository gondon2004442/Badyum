# Свой relay — надстройка над основным стеком:
#
#   docker compose -f infra/docker-compose.prod.yml \
#                  -f infra/docker-compose.coturn.yml up -d
#
# Нужен, только если не устраивает managed relay Cloudflare (см. .env.example).
# Требует того, чего managed-вариант не требует: выделенного белого IPv4,
# открытого UDP 3478 и диапазона 49160-49200/udp.
#
# Отдельным файлом, а не профилем: compose подставляет переменные во всём файле
# сразу, поэтому обязательные BADYUM_TURN_* ломали бы запуск и тем, кто coturn
# не поднимает.

name: badyum

services:
  coturn:
    image: coturn/coturn:4.6
    network_mode: host
    restart: unless-stopped
    command:
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${BADYUM_TURN_SECRET:?сгенерируй, например openssl rand -hex 32}
      - --realm=${BADYUM_TURN_REALM:?домен для relay, один, без запятых}
      - --external-ip=${BADYUM_TURN_EXTERNAL_IP:?белый IP этой машины}
      - --min-port=49160
      - --max-port=49200
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      # Не даём использовать relay как проход во внутреннюю сеть.
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --log-file=stdout
