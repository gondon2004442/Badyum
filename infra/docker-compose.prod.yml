# Боевое развёртывание: `docker compose -f infra/docker-compose.prod.yml up -d`
#
# Нужны только домен, направленный на этот сервер, и файл .env рядом с этим
# файлом (см. infra/.env.example). Сертификат Caddy получит сам.

name: badyum

services:
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    environment:
      BADYUM_DOMAIN: ${BADYUM_DOMAIN:?укажи домен, например badyum.app}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Сертификаты переживают пересборку — иначе на каждом деплое
      # перевыпуск и быстрый упор в лимиты Let's Encrypt.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server

  server:
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    restart: unless-stopped
    environment:
      BADYUM_TOKEN_SECRET: ${BADYUM_TOKEN_SECRET:?сгенерируй, например openssl rand -hex 32}
      # Наружу сервер не публикуется: браузер ходит к нему через Caddy на том
      # же домене. Список задаётся явно, потому что доменов может быть
      # несколько, а к ним добавляются источники десктопного приложения.
      BADYUM_ORIGINS: ${BADYUM_ORIGINS:?перечисли адреса через запятую}
      # Managed relay Cloudflare — путь по умолчанию: не нужен ни белый IP, ни
      # открытый UDP, ни своя машина под coturn.
      BADYUM_CF_TURN_KEY_ID: ${BADYUM_CF_TURN_KEY_ID:-}
      BADYUM_CF_TURN_API_TOKEN: ${BADYUM_CF_TURN_API_TOKEN:-}
      # Свой coturn, если поднят надстройкой docker-compose.coturn.yml.
      BADYUM_TURN_HOSTS: ${BADYUM_TURN_HOSTS:-}
      BADYUM_TURN_SECRET: ${BADYUM_TURN_SECRET:-}
      BADYUM_MAX_PARTICIPANTS: ${BADYUM_MAX_PARTICIPANTS:-8}
    expose:
      - "8787"

volumes:
  caddy-data:
  caddy-config:
