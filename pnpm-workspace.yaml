packages:
  - "packages/*"
  - "apps/*"

# pnpm 10 не запускает install-скрипты зависимостей, пока их явно не разрешили,
# и падает с ERR_PNPM_IGNORED_BUILDS. На свежем клоне это ломает `pnpm dev`
# ещё до старта: он проверяет зависимости и упирается в ту же ошибку.
#
# esbuild — сборщик под капотом Vite, его postinstall ставит платформенный
# бинарник. Разрешаем осознанно и только его.
onlyBuiltDependencies:
  - esbuild
