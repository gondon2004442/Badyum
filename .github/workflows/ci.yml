name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Версия не указывается: action берёт её из поля packageManager в
      # package.json. Заданная в двух местах, она роняет шаг целиком.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Типы
        run: pnpm -r typecheck

      - name: Тесты
        run: pnpm --filter @badyum/server test

      - name: Сборка клиента
        run: pnpm --filter @badyum/client build

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri на Linux собирается против системного WebKitGTK — без этих
      # пакетов падает не код, а линковка.
      - name: Системные зависимости Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Проверка Rust
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
