name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Версия не указывается: action берёт её из поля packageManager в
      # package.json. Заданная в двух местах, она роняет шаг целиком.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Типы
        run: pnpm -r typecheck

      # Все пакеты, а не только server: тесты воркера появились позже, и
      # прицельный фильтр молча их пропускал.
      - name: Тесты
        run: pnpm -r test

      - name: Сборка клиента
        run: pnpm --filter @badyum/client build

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri на Linux собирается против системного WebKitGTK — без этих
      # пакетов падает не код, а линковка.
      - name: Системные зависимости Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Проверка Rust
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

  # Android собирается здесь, а не только по тегу. Иначе опечатка в java или
  # в манифесте всплывала бы в момент выпуска — то есть тогда, когда чинить её
  # хуже всего.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # AGP 8.13 не собирается на JDK ниже 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile

      # Адрес здесь любой: проверяется, что проект собирается, а не куда он
      # ходит. Настоящий приезжает из переменной репозитория при выпуске.
      - name: Синхронизировать проект
        working-directory: apps/mobile
        env:
          BADYUM_SERVER_URL: https://badyum.ru
        run: npx cap sync android

      - name: Сборка Android
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
