name: Release

# Установщики собираются по тегу: git tag v0.1.0 && git push --tags
on:
  push:
    tags:
      - "v*"
  # Прогнать сборку, не публикуя релиз, — чтобы проверить, что она вообще жива.
  workflow_dispatch:

jobs:
  installers:
    # Без этого GITHUB_TOKEN выдаётся только на чтение, и tauri-action падает на
    # «Resource not accessible by integration» уже после того, как всё собрано:
    # установщики лежат на раннере, а создать релиз и приложить их к нему нечем.
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Системные зависимости Tauri
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Версия берётся из поля packageManager в package.json: заданная ещё и
      # здесь, она роняет шаг с "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      # Адрес сервера зашивается в сборку: страница в приложении грузится из
      # локальных файлов, и относительный путь оттуда никуда не ведёт.
      # Задаётся переменной репозитория BADYUM_SERVER_URL
      # (Settings -> Secrets and variables -> Actions -> Variables).
      - name: Адрес сервера
        shell: bash
        run: |
          SERVER="${{ vars.BADYUM_SERVER_URL }}"
          if [ -z "$SERVER" ]; then
            echo "::error::Не задана переменная BADYUM_SERVER_URL — приложение собралось бы без адреса сервера и не смогло бы никуда подключиться."
            exit 1
          fi
          echo "VITE_BADYUM_SERVER=$SERVER" > packages/client/.env.desktop
          echo "Сервер: $SERVER"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          # Пусто при ручном запуске — тогда tauri-action только собирает и
          # ничего не публикует. Раньше сюда всегда уезжал github.ref_name, и
          # проверочный прогон с ветки заводил черновик релиза с именем «main»
          # вопреки тому, что обещает комментарий в начале файла.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Badyum {0}', github.ref_name) || '' }}
          releaseBody: |
            Всё то же, что на сайте, плюс то, чего в браузере быть не может:
            **рация и панель канала работают поверх игры**, а на телефоне
            **разговор не обрывается**, когда свернул приложение.

            Система написана прямо в имени файла — бери свою:

            - **Windows** — `Badyum-…-Windows.msi`
            - **macOS** — `Badyum-…-macOS-AppleSilicon.dmg`
            - **Linux** — `Badyum-…-Linux.AppImage` или `.deb`
            - **Android** — `Badyum-…-Android.apk`

            `AppleSilicon` в имени не для красоты: сборка идёт под M1 и новее,
            на интеловом маке она не запустится.

            ### Android

            Главное отличие от сайта: **разговор не обрывается**, когда
            свернул приложение или заблокировал экран. В браузере на телефоне
            так не умеет никто — вкладку усыпляют, и голос пропадает.

            Ставится файлом, минуя магазин, поэтому телефон спросит разрешение
            устанавливать из этого источника — надо согласиться. При первом
            входе в канал спросит микрофон, а следом уведомления: второе можно
            и запретить, разговор от этого не сломается, просто пропадёт
            плашка «Идёт разговор».

            Обновлять приложение ради изменений в интерфейсе не нужно — сайт
            оно берёт с сервера. Новый `.apk` нужен, только когда меняется сама
            оболочка.

            ### Система будет ругаться, и это ожидаемо

            Сборки не подписаны: подпись стоит денег (99 $ в год у Apple,
            сертификат у Microsoft), а влияет она только на текст
            предупреждения, не на работу.

            - **Windows**: SmartScreen скажет «Windows защитила ваш компьютер»
              → «Подробнее» → «Выполнить в любом случае».
            - **macOS**: «не удаётся проверить разработчика» → правой кнопкой
              по приложению → «Открыть» → «Открыть».

            ### Что стоит знать

            Адрес сервера зашит в сборку. Обновляется приложение не само —
            новую версию надо скачать отсюда же.
          releaseDraft: true
          prerelease: false

  # Android собирается отдельно: платформа одна, а матрица выше про настольные
  # системы. Ждёт установщиков, потому что черновик релиза заводят они, — файл
  # надо к чему-то прикладывать.
  android:
    needs: installers
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # AGP 8.13 не собирается на JDK ниже 17. Берём 21: на нём же собирают
      # Capacitor, и предупреждений о неподдерживаемой версии не будет.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile

      - name: Адрес сервера
        shell: bash
        run: |
          SERVER="${{ vars.BADYUM_SERVER_URL }}"
          if [ -z "$SERVER" ]; then
            echo "::error::Не задана переменная BADYUM_SERVER_URL — приложение собралось бы без адреса сервера и открывало бы пустой экран."
            exit 1
          fi
          echo "BADYUM_SERVER_URL=$SERVER" >> "$GITHUB_ENV"
          echo "Сервер: $SERVER"

      # Переносит адрес сервера и список плагинов в проект Android: оба файла
      # генерируются и в репозиторий не попадают, так что шаг обязателен.
      - name: Синхронизировать проект
        working-directory: apps/mobile
        run: npx cap sync android

      - name: Собрать APK
        working-directory: apps/mobile/android
        env:
          # Номер прогона монотонно растёт — ровно то, чего требует Android от
          # versionCode, чтобы разрешить обновление поверх установленного.
          BADYUM_VERSION_CODE: ${{ github.run_number }}
          BADYUM_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '0.0.0-dev' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Назвать файл по-человечески
        shell: bash
        run: |
          # Без «v»: в имени файла она ничего не добавляет, а рядом с номером
          # версии выглядит как часть названия.
          VERSION="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.0-dev' }}"
          VERSION="${VERSION#v}"
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/Badyum-${VERSION}-Android.apk"
          echo "APK_NAME=Badyum-${VERSION}-Android.apk" >> "$GITHUB_ENV"
          echo "APK_PATH=dist/Badyum-${VERSION}-Android.apk" >> "$GITHUB_ENV"

      # Кладём и в артефакты прогона: при ручном запуске релиза нет, а
      # проверить сборку всё равно надо.
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

      # Прикладываем точечно, через API, а не готовым действием: черновик уже
      # создан tauri-action вместе с описанием, и переписывать его целиком ради
      # одного файла незачем.
      - name: Приложить APK к релизу
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const tag = context.ref.replace("refs/tags/", "");

            // Черновик по тегу через API не найти — только перебором.
            const releases = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
            const release = releases.data.find((r) => r.tag_name === tag);
            if (!release) throw new Error(`релиз с тегом ${tag} не найден`);

            const name = process.env.APK_NAME;
            const path = process.env.APK_PATH;

            // Перезапуск прогона не должен спотыкаться о свой прошлый файл.
            const already = release.assets.find((a) => a.name === name);
            if (already) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: already.id });
            }

            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name,
              data: fs.readFileSync(path),
              headers: {
                "content-type": "application/vnd.android.package-archive",
                "content-length": fs.statSync(path).size,
              },
            });

            core.info(`${name} приложен к релизу ${tag}`);

      # Идёт последним: к этому моменту все сборки уже на месте.
      - name: Подписать файлы по системам
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace("refs/tags/", "");
            const version = tag.replace(/^v/, "");

            const releases = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
            const release = releases.data.find((r) => r.tag_name === tag);
            if (!release) throw new Error(`релиз с тегом ${tag} не найден`);

            /*
              Сборщики называют файлы по архитектуре: «amd64.AppImage»,
              «x64_en-US.msi», «aarch64.dmg». Человеку, пришедшему скачать
              приложение, это не говорит ничего — он знает, что у него Windows,
              а не что у него amd64. Приводим к виду, который читается с одного
              взгляда.

              Архитектура остаётся только у macOS, и не для красоты: раннер
              собирает под Apple Silicon, и на интеловом маке этот файл не
              запустится. Умолчать об этом значит отправить человека скачивать
              заведомо нерабочее.
            */
            const NAMES = [
              [".msi", `Badyum-${version}-Windows.msi`],
              ["-setup.exe", `Badyum-${version}-Windows-setup.exe`],
              [".dmg", `Badyum-${version}-macOS-AppleSilicon.dmg`],
              [".AppImage", `Badyum-${version}-Linux.AppImage`],
              [".deb", `Badyum-${version}-Linux.deb`],
              [".rpm", `Badyum-${version}-Linux.rpm`],
              [".apk", `Badyum-${version}-Android.apk`],
            ];

            for (const asset of release.assets) {
              /*
                Архив для автообновления. Обновлялки у нас нет — приложение
                качают заново, — и скачивать его незачем, а в списке он выглядит
                как ещё одна сборка для Mac. Ровно та путаница, от которой
                избавляемся, поэтому убираем.
              */
              if (asset.name.endsWith(".app.tar.gz") || asset.name.endsWith(".sig")) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
                core.info(`убран ${asset.name} — это служебный архив обновлялки`);
                continue;
              }

              const match = NAMES.find(([suffix]) => asset.name.endsWith(suffix));
              if (!match) {
                // Не угадали — оставляем как есть. Переименовать наугад хуже,
                // чем оставить непонятное имя: так хотя бы видно, что это.
                core.warning(`не знаю, для какой системы ${asset.name} — оставляю`);
                continue;
              }

              const [, name] = match;
              if (asset.name === name) continue;

              await github.rest.repos.updateReleaseAsset({ owner, repo, asset_id: asset.id, name });
              core.info(`${asset.name} → ${name}`);
            }
